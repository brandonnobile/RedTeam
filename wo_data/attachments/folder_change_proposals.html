<script>
    var WorkorderID = '1940046';
    var WorkorderMod = '00';
    var OpenLink = '';
    if (OpenLink != "true") {
        $(".RightClickFile").contextmenu(function (event) {
            var id = $(this).attr("id");
            var count = $(this).attr("counter");
            var idItem = $(this).attr("idItem");
            var check = document.getElementById("chkItem" + count).checked;
            if (check == false) trclick(count);
            var nSelections = document.getElementById("nSelections").value;
            var itemsDelete = "";
            if (nSelections > 1) {
                for (i = 1; i <= nSelections; i++) {
                    if (document.getElementById("chkItem" + i)) {
                        if (document.getElementById("chkItem" + i).checked) {
                            itemsDelete = itemsDelete + document.getElementById("UploadID" + i).value + ",";
                        }
                    }
                }
            }
            var param = "WorkorderID=" + WorkorderID + "&WorkorderMod=" + WorkorderMod + "&IdItem=" + idItem + "&line=" + count + "&nSelections=" + nSelections + "&lstFilesID=" + itemsDelete;
            var jsonParamsAux = "/ProjectDocuments/jsonEvalToolsFile.asp?p=" + Base64.encode(param);
            if ($('#trToolsFile_' + count)) $('#trToolsFile_' + count).css("display", 'none');
            showJsonOptions(id, count, jsonParamsAux, 'show', 'trToolsFile_' + count, 'tr_' + count, '', 'row');
            event.preventDefault();
        });
    }
</script>
