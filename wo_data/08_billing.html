function getChartOfAccount(){
    $.get(`https://api.acumatica.flex.redteam.com/fn/chart-of-account/5342`, object => {
        const accounts = object.data        
        document.getElementById("Statement").disabled = false;
        $('#Statement').empty().append('<option value="0">Select one...</option>');

        document.getElementById("ARAccount").disabled = false;
        $('#ARAccount').empty().append('<option value="0">Select one...</option>');

        document.getElementById("SalesAccount").disabled = false;
        $('#SalesAccount').empty().append('<option value="0">Select one...</option>');

        for (current of accounts) {
            let selectedLabel = ''
            $('#Statement').append(`<option value="${current.AccountCD}">
            ${current.AccountCD} - ${current.AccountClass} - ${current.Description}</option>`);

            if(current.ControlAccountModule == "AR"){
                $('#ARAccount').append(`<option value="${current.AccountCD}">
                ${current.AccountCD} - ${current.AccountClass} - ${current.Description}</option>`);
            }

            $('#SalesAccount').append(`<option value="${current.AccountCD}">
            ${current.AccountCD} - ${current.AccountClass} - ${current.Description}</option>`);
        }
    });
}

function getCashAccount(){
    $.get(`https://api.acumatica.flex.redteam.com/fn/statement-cycle/5342`, object => {
        const accounts = object.data
        
        document.getElementById("CashAccount").disabled = false;
        $('#CashAccount').empty().append('<option value="0">Select one...</option>');

        for (current of accounts) {
            let selectedLabel = ''
            $('#CashAccount').append(`<option value="${current.CycleID}">
            ${current.CycleID} - ${current.Description} </option>`);
        }
    });
}

function saveCustomers(){
    let body =  {

        "CARAccountID" : document.getElementById("ARAccount").value,
        "custom":{

                "DiscTakenAcctID": document.getElementById("CashAccount").value
            }
        },
        "DefLocation":{
            "CSalesAcctID":document.getElementById("SalesAccount").value
        }
    }

    $.post(`https://api.acumatica.flex.redteam.com/fn/customer-rts/5342`, body , function (data) {
        console.log("data",data)
    });

    console.log("body",body)


}
