  function Verify(line,params)
  {	
    if(document.getElementById("StoredMatDescription" + line).value == "")
	{
	  showMessageBar("<b>Warning!</b> Description is required.");
	  document.getElementById("StoredMatDescription" + line).focus();
	  return;
	}
	
	if(document.getElementById("StoredMatAmount" + line).value == "")
	{
	  showMessageBar("<b>Warning!</b> Amount is required.");
	  document.getElementById("StoredMatAmount" + line).focus();
	  return;
	}
	else
	{
	    if (!isValidPositiveDecimalNumber(document.getElementById("StoredMatAmount" + line).value))
	  {
	   showMessageBar("<b>Warning!</b> Amount must be a valid positive number.")
	   document.getElementById("StoredMatAmount" + line).focus();
	   return;
	  }
}
    var accessBDs = document.getElementById("accessBDs").value;
    if (accessBDs == "1" || accessBDs == "All") {
        Form1.action = "StoredMaterials.asp?WorkorderID=&WorkorderMod=&WorkorderStatus=&UniqueWorkorderInvoiceID=&FacilityID=&row=" + line + "&band=save" + params;
    }
    else {
        Form1.action = "StoredMaterials.asp?WorkorderID=&WorkorderMod=&WorkorderStatus=&FacilityID=&row=" + line + "&band=save" + params;
    }
	Form1.submit();
  }
  
  
  function SaveEdit(line,params)
  {	
    if(document.getElementById("StoredMatEditDescription" + line).value == "")
	{
	  showMessageBar("<b>Warning!</b> Description is required.");
	  document.getElementById("StoredMatEditDescription" + line).focus();
	  return;
	}
	
	if(document.getElementById("StoredMatEditAmount" + line).value == "")
	{
	  showMessageBar("<b>Warning!</b> Amount is required.");
	  document.getElementById("StoredMatEditAmount" + line).focus();
	  return;
	}
	else
	{
	    if (!isValidPositiveDecimalNumber(document.getElementById("StoredMatEditAmount" + line).value))
	  {
	   showMessageBar("<b>Warning!</b> Amount must be a valid positive number.")
	   document.getElementById("StoredMatEditAmount" + line).focus();
	   return;
	  }
	}
    Form1.action = "StoredMaterials.asp?WorkorderID=&WorkorderMod=&WorkorderStatus=&FacilityID=&row=" + line + "&band=saveedit" + params;
	Form1.submit();
  }  
  
  function expand(line)
  {
    if (document.getElementById("TRadd" + line).style.display == "") {
        document.getElementById("TRaddform" + line).style.display = '';
        document.getElementById("TRadd" + line).style.display = 'none';
        document.getElementById("StoredMatDescription" + line).focus();
    }
    else {
        document.getElementById("TRaddform" + line).style.display = 'none';
        document.getElementById("TRadd" + line).style.display = '';
    }
  }
  
  function ExpandEdit(line)
  {
    if (document.getElementById("TRitem" + line).style.display == "") {
        document.getElementById("TReditform" + line).style.display = '';
        document.getElementById("TRitem" + line).style.display = 'none';
        document.getElementById("StoredMatEditDescription" + line).focus();
    }
    else {
        document.getElementById("TReditform" + line).style.display = 'none';
        document.getElementById("TRitem" + line).style.display = '';
    }
  }
    
  function deleteitem(ID,params)
  {	
  	var x=window.confirm("Do you want to delete this record?");
	if (x) {
        var accessBDs = document.getElementById("accessBDs").value;
        if (accessBDs == "1" || accessBDs == "All") {

        else {
            Form1.action = "StoredMaterials.asp?WorkorderID=&WorkorderMod=&WorkorderStatus=&FacilityID=&StoredMaterialsID=" + ID + "&band=delete" + params;
        }
		Form1.submit();
	}
  }

function initialize()
{

        comboheight=combowidth=document.getElementById("staticmenu").offsetHeight;
        setInterval("staticit_ie()",50);
        document.getElementById("staticmenu").style.display="block";
    }
    else

        combowidth=document.getElementById("staticmenu").offsetWidth;
        comboheight=combowidth=document.getElementById("staticmenu").offsetHeight;

}
