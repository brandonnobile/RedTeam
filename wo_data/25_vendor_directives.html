    function isFirefox() {
        var is_firefox = navigator.userAgent.indexOf('Firefox') > -1;
        return is_firefox;
    }
    if (!isFirefox()) {
        window.onscroll = hideMenu;
    } else {
        function hideMenuBody(e) {

            var divList, i;
            divList = document.getElementsByTagName("div");

            for (i = 0; i < divList.length; i++) {
                if (divList[i].id.substring(0, 10) == '_menuTools') {
                    if (e.target.id != divList[i].id) {
                        document.body.removeEventListener('click', hideMenuBody, false);
                        $('#' + divList[i].id).hide();
                    }
                }
            }
        }
    }
    function showMenuFire(id, refpos) {
        if (!isFirefox())
            hideMenu();

        if (document.getElementById(id).style.visibility != "visible") {
            var elementoRef = document.getElementById(refpos);
            var elemento = document.getElementById(id);
            var pos = getAbsoluteElementPosition(elementoRef);
            elemento.style.visibility = "visible";
            elemento.style.left = pos.left + "px";
            elemento.style.top = pos.top + 22 + "px";
            if (isFirefox()) {
                var timeOutShow
                timeOutShow = 0;
                $("body").attr("onclick", "").unbind("click");
                $("div").attr("onclick", "").unbind("click");
                elemento.style.left = pos.left - 10 + "px";
                elemento.style.top = pos.top + 15 + "px";
                jQuery.fx.off = true;
                setTimeout(function () {
                    $('#' + id).show(function () {
                        document.body.addEventListener('click', hideMenuBody, false);
                    });
                }, timeOutShow);
            }
            else {
                try {
                    event.cancelBubble = true;
                }
                catch (error) {
                }
            }
        }
        else {
            if (isFirefox()) {
                var elemento = document.getElementById(id);
                elemento.style.visibility = "hidden";
            }
        }
    }
       
     function gotoPage(flag)
    { 
        var col = (document.getElementById("hdnCurrentSortCriterial").value.split(","))[0];
        
        paginationControl(flag, "sortCriterial=" + col + "&justNavigation=1", null);
    }

    function refresh(lineItem)
    {
        paginationControl(null, null, lineItem);
    }
  
    function paginationControl(flag, actionCommand, lineItem, pNumber)
    {    
        var pageController = document.getElementById("pageController");
        var gotoPageNumber = parseInt(pageController.value);

        if (flag)
        {       
            switch (flag.toLowerCase())
            {
                case "prior":
                    if (pageController.selectedIndex == 0) return;
                    gotoPageNumber--;
                    break;

                case "next":
                    if (pageController.selectedIndex == pageController.length - 1) return;
                    gotoPageNumber++;
                    break;
            }
        }
        
        gotoPageNumber = (pNumber)?pNumber:gotoPageNumber;
       
        var currentUrl = new String(document.location.href.toLowerCase()); // a minuscula
        var CurrentUrlNorm = new String(document.location.href); 
         
        if (currentUrl.indexOf("filter=true") >= 0 || (actionCommand != null && actionCommand != ""))
        {
            document.getElementById("hdnCurrentPageNumber").value = gotoPageNumber;
            
            if (actionCommand) document.getElementById("hdnActionCommand").value = (actionCommand != "") ? actionCommand : "";
            
            var pos = currentUrl.indexOf("managedirectives.asp");
         
            if (pos > 0)
            {
                var urlParams = currentUrl.substring(pos);
                var urlParamsNorm = CurrentUrlNorm.substring(pos);
                
                if (lineItem)
                {
                    if (urlParams.indexOf("&i=") < 0 && urlParams.substring(0,2) != "i=") urlParamsNorm += ((urlParamsNorm.length > 0) ? "&" : "") + "i=" + lineItem;
                }
               
                if (currentUrl.indexOf("filter=true") < 0) urlParamsNorm = addUrlParameter(urlParamsNorm, "filter", "true");               
                SendFilters(urlParamsNorm);
               
             }
        }
        else
        {
            var urlTarget = addUrlParameter(document.location, "currentPageNumber", gotoPageNumber);
            
            if (lineItem) urlTarget = addUrlParameter(urlTarget, "i", lineItem);

            document.location = urlTarget;
        }
    }  
    
    function sortReport(col)
    {
        paginationControl(null, "sortCriterial=" + col + "&headerClicked=1", null, 1);

function deleteln(Directive,row)
{	
    var x=window.confirm("The Vendor Directive will be deleted. Are you sure ?")
    if (x)
    {
		if (document.getElementById("jsTdAmount" + row)) {

            var tdAmount = document.getElementById("jsTdAmount" + row).innerHTML;
            
            var bandAmount = 0;

            var posTBD = tdAmount.indexOf("TBD");
            var posAst = tdAmount.indexOf("***.**");
            
            if (posTBD >= 0) {
                bandAmount = 1;
            }
            if (posAst >= 0) {
                bandAmount = 1;
            }

            if (bandAmount == 0) {
                var pageTotalAmount = document.getElementById("pageTotalAmount").innerHTML;
                document.getElementById("pageTotalAmount").innerHTML = SubTwoRealValues(pageTotalAmount, tdAmount, 2);
            }
        }
        
        if (document.getElementById("tr" + row))
        document.getElementById("tr" + row).style.display = "none";

        if (document.getElementById("trLine" + row))
        document.getElementById("trLine" + row).style.display = "none";
            
        FormAux.action = "ManageDirectives.asp?p=" + escape(Directive);
        FormAux.target = "ifrmAux";
        FormAux.submit();
        FormAux.target = "_self";  
    }
	else
		window.alert("The Vendor Directive was not deleted.")
}

function ivalue(paramId){
	var inputElements = document.getElementsByTagName('input');
	var count = inputElements.length;
	var ivalue = "0";
	var parentid;
	for(var i=0; i < count ; i ++ ) {
		if(inputElements[i].type == "text"){
			if(inputElements[i].value == paramId){
				ivalue = inputElements[i].id;
				ivalue = ivalue.substring(8,ivalue.length);
				break;
			}
		}
	}
	return ivalue
}
