        function hideMenuBody(e) {

            var divList, i;
            divList = document.getElementsByTagName("div");

            for (i = 0; i < divList.length; i++) {
                if (divList[i].id.substring(0, 10) == '_menuTools') {

                        document.body.removeEventListener('click', hideMenuBody, false);

            }
        }
    }
    function showMenuFire(id, refpos) {
        if (!isFirefox())
            hideMenu();

        if (document.getElementById(id).style.visibility != "visible") {
            var elementoRef = document.getElementById(refpos);
            var elemento = document.getElementById(id);
            var pos = getAbsoluteElementPosition(elementoRef);
            elemento.style.visibility = "visible";
            elemento.style.left = pos.left + "px";
            elemento.style.top = pos.top + 22 + "px";
            if (isFirefox()) {
                var timeOutShow
                timeOutShow = 0;
                $("body").attr("onclick", "").unbind("click");
                $("div").attr("onclick", "").unbind("click");
                elemento.style.left = pos.left - 10  + "px";
                elemento.style.top = pos.top + 20 + "px";
                jQuery.fx.off = true;
                setTimeout(function () {
                    $('#' + id).show(function () {
                        document.body.addEventListener('click', hideMenuBody, false);
                    });
                }, timeOutShow);
            }
            else {
                try {
                    event.cancelBubble = true;
                }
                catch (error) {
                }
            }
        }
        else {
            if (isFirefox()) {
                var elemento = document.getElementById(id);
                elemento.style.visibility = "hidden";
            }
        }
    }

    function paginationControl(flag, actionCommand, lineItem, pNumber) {

        var pageController = document.getElementById("pageController");
        var gotoPageNumber = parseInt(pageController.value);

        if (flag) {
            switch (flag.toLowerCase()) {
                case "prior":
                    if (pageController.selectedIndex == 0) return;
                    gotoPageNumber--;
                    break;

                case "next":
                    if (pageController.selectedIndex == pageController.length - 1) return;
                    gotoPageNumber++;
                    break;
            }
        }

        gotoPageNumber = (pNumber) ? pNumber : gotoPageNumber;

        var currentUrl = new String(document.location.href.toLowerCase());

        if (currentUrl.indexOf("filter=true") >= 0 || (actionCommand != null && actionCommand != "")) {
            document.getElementById("hdnCurrentPageNumber").value = gotoPageNumber;

            if (actionCommand) document.getElementById("hdnActionCommand").value = (actionCommand != "") ? actionCommand : "";

            var pos = currentUrl.indexOf("managetmsheets.asp");

            if (pos > 0) {
                var urlParams = currentUrl.substring(pos);

                if (lineItem) {
                    if (urlParams.indexOf("&i=") < 0 && urlParams.substring(0, 2) != "i=") urlParams += ((urlParams.length > 0) ? "&" : "") + "i=" + lineItem;
                }

                document.FrmTMSheets.submit();

            }
        }
        else {
            var urlTarget = addUrlParameter(document.location, "currentPageNumber", gotoPageNumber);

            if (lineItem) urlTarget = addUrlParameter(urlTarget, "i", lineItem);

            document.location = urlTarget;
        }
    }

    function selectAll() {
        var nItems = document.getElementById("nCC").value;
        var value = document.getElementById("chkSelectAll").checked;

        if (value) {
            document.getElementById("nSelections").value = nItems;
        }
        else {
            document.getElementById("nSelections").value = "0";
        }

        for (pos = 1; pos <= nItems; pos++) {
            if (document.getElementById("chkItem" + pos)) {
                if (document.getElementById("chkItem" + pos).style.display != "none") {
                    document.getElementById("chkItem" + pos).checked = value;
                }
            }
        }

        concatenateSelections();
        showCloseCommitmentsOption();
    }

    function countSelections(pos,idItem,WorkorderID) {
        var  flag = "VERIFYEXISTMSHEETS";
        var params;
        params ="flag="+flag+"&idItem="+idItem+"&WorkorderID="+WorkorderID;

            $.ajaxSetup({ cache: false });
            $.ajax({
                    url: '/rts/app/asp/jsongetdata.asp',
                    type: "GET",
                    data: params,
                    cache : false,
                    success: function (a) {
                        var WorkorderTMuniqueID = a['datos'][0]['WorkorderTMuniqueID'];
                        if(WorkorderTMuniqueID>0){
                            var nSelections = document.getElementById("nSelections").value;
                            var chkSelection = false;
                            if (document.getElementById("chkItem" + pos))
                                chkSelection = document.getElementById("chkItem" + pos).checked;

                            if (chkSelection) {
                                nSelections++;
                                document.getElementById("nSelections").value = nSelections;
                            }
                            else {
                                nSelections--;
                                document.getElementById("nSelections").value = nSelections;
                            }

                            concatenateSelections();
                            showCloseCommitmentsOption(idItem,WorkorderID);
                        }
                        else{
                            showMessageBar('This document no longer exists. It may have been removed or deleted. Please check RedTeam and try again.');   
                        }
                    },
                    error: function (jqXHR, textStatus, error) {
                        console.log('Error');
                    }
            });
        

    }

    function concatenateSelections() {
        var nSelections = document.getElementById("nSelections").value;
        var nItems = document.getElementById("nCC").value;
        var SelectedItems = "";

        for (pos = 1; pos <= nItems; pos++) {

            var chkSelection = false
            if (document.getElementById("chkItem" + pos))
                chkSelection = document.getElementById("chkItem" + pos).checked;

            if (chkSelection) {
                var AssemblyNumber = document.getElementById("AssemblyNumber" + pos).value;
                SelectedItems = SelectedItems + AssemblyNumber + ",";
            }
        }
        document.getElementById("SelectedItems").value = SelectedItems;
    }

    function CommitTAM(url, row,idItem,WorkorderID) {
        var  flag = "VERIFYEXISTMSHEETS";
        var params;
        params ="flag="+flag+"&idItem="+idItem+"&WorkorderID="+WorkorderID;

            $.ajaxSetup({ cache: false });
            $.ajax({
                    url: '/rts/app/asp/jsongetdata.asp',
                    type: "GET",
                    data: params,
                    cache : false,
                    success: function (a) {
                        var WorkorderTMuniqueID = a['datos'][0]['WorkorderTMuniqueID'];
                        if(WorkorderTMuniqueID>0){
                            document.getElementById("tr" + row).className = "committedtext";
                            document.getElementById("tr" + row).style.backgroundColor = "#add8e6";

                            if (document.getElementById("tdChkItem" + row))
                                document.getElementById("tdChkItem" + row).innerHTML = "x";
                            if (document.getElementById("jsStatus" + row))
                                document.getElementById("jsStatus" + row).innerHTML = "Committed";
                            if (document.getElementById("jsToolCommit" + row)) {
                                document.getElementById("jsToolCommit" + row).style.display = "none";
                                document.getElementById("jsToolCommit" + row).style.width = "0";
                            }
                            
                            Form1.action = "ManageTMsheets.asp?p=" + escape(url);
                            Form1.target = "ifrmAux";
                            Form1.submit();
                            Form1.target = "_self";
                        }
                        else{
                            showMessageBar('This document no longer exists. It may have been removed or deleted. Please check RedTeam and try again.');   
                        }
                    },
                    error: function (jqXHR, textStatus, error) {
                    }
            });

    }

        var SelectedItems = document.getElementById("SelectedItems").value;

        band = 0;

        if (num > 0) {
            for (i = 1; i <= num; i++) {

                    if (document.getElementById('chkItem' + i).checked) {

                        document.getElementById("tr" + i).className = "committedtext";
                        document.getElementById("tr" + i).style.backgroundColor = "#add8e6";

                        if (document.getElementById("jsStatus" + i))

                        if (document.getElementById("jsToolCommit" + i)) {
                            document.getElementById("jsToolCommit" + i).style.display = "none";
                            document.getElementById("jsToolCommit" + i).style.width = "0";
                        }
                    }

    function sendMultipleCommit(url) {
        var oldUrl = FrmTMSheets.action
        FrmTMSheets.action = "ManageTMsheets.asp?" + url;
        FrmTMSheets.target = "ifrmAux";
        FrmTMSheets.submit();
        FrmTMSheets.action = oldUrl;
        FrmTMSheets.target = "_self";

        if (document.getElementById("btnPosted")) document.getElementById("btnPosted").style.display = 'none';
        document.getElementById("Icons_General").style.display = "inline-flex";
        if (document.getElementById("tabhidden2")) document.getElementById("tabhidden2").style.display = "";
        if (document.getElementById("chkSelectAll")) document.getElementById("chkSelectAll").checked = false;
        if (document.getElementById("nSelections")) document.getElementById("nSelections").value = "0";
        if (document.getElementById("SelectedItems")) document.getElementById("SelectedItems").value = ""; 
    }
