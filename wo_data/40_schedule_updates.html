<script language="JavaScript">
    function isFirefox() {
        var is_firefox = navigator.userAgent.indexOf('Firefox') > -1;
        return is_firefox;
    }
    if (!isFirefox()) {
        window.onscroll = hideMenu;
    } else {
        function hideMenuBody(e) {

            var divList, i;
            divList = document.getElementsByTagName("div");

            for (i = 0; i < divList.length; i++) {
                if (divList[i].id.substring(0, 10) == '_menuTools') {
                    if (e.target.id != divList[i].id) {
                        document.body.removeEventListener('click', hideMenuBody, false);
                        $('#' + divList[i].id).hide();
                    }
                }
            }
        }
    }
    function showMenuFire(id, refpos) {
        if (!isFirefox())
            hideMenu();

        if (document.getElementById(id).style.visibility != "visible") {
            var elementoRef = document.getElementById(refpos);
            var elemento = document.getElementById(id);
            var pos = getAbsoluteElementPosition(elementoRef);
            elemento.style.visibility = "visible";
            elemento.style.left = pos.left + "px";
            elemento.style.top = pos.top + 22 + "px";
            if (isFirefox()) {
                var timeOutShow
                timeOutShow = 0;
                $("body").attr("onclick", "").unbind("click");
                $("div").attr("onclick", "").unbind("click");
                elemento.style.left = pos.left - 15 + "px";
                elemento.style.top = pos.top + 25 + "px";
                jQuery.fx.off = true;
                setTimeout(function () {
                    $('#' + id).show(function () {
                        document.body.addEventListener('click', hideMenuBody, false);
                    });
                }, timeOutShow);
            }
            else {
                try {
                    event.cancelBubble = true;
                }
                catch (error) {
                }
            }
        }
        else {
            if (isFirefox()) {
                var elemento = document.getElementById(id);
                elemento.style.visibility = "hidden";
            }
        }
    }

    function gotoManagePage(page) {
        document.location.href = page;
    }

    function loadPage(page) {
        document.location.href = page;
    }

    function verifyRefresh() {
        var refreshTab = parent.top.document.getElementById("refreshTab").value;
        var iParam = parent.top.document.getElementById("iParam").value;

    function DeleteSchedule(Url) {
        var x = window.confirm("The Schedule will be deleted. Are you sure ?")
        if (x) {
            var link = "ManageSchedule.asp?p=" + encodeURIComponent(Url);
            document.location = link;
        }
        else {

        var direccion = "AttachSchedule.asp?p=" + encodeURIComponent(Url);

    }

    function CommitSchedule(Url) {
        var x = window.confirm("You are about to Commit this record.\r\nOnce Committed, it cannot be changed. Do you want to continue?")
        if (x) {
            FrmDateManagement.action = "ManageSchedule.asp?p=" + encodeURIComponent(Url);

        else

    }
