function refreshFromRecord(){ 
     var currentUrlString = new String(document.location.href);
     currentUrlString = currentUrlString.replace("#", "");
     var urlParamsPage;
     var posInt = currentUrlString.indexOf("?");
     var act,rep;

     if (posInt < 0) {
          urlParamsPage = currentUrlString + "?i=1";
          currentUrlString = urlParamsPage;
          document.getElementById("formRefresh").action = currentUrlString;
          formRefresh.submit();
     }
     else {
          var posPage = (currentUrlString.toLowerCase()).indexOf("documents.asp");
          urlParamsPage = currentUrlString.substring(posPage, currentUrlString.length);
          var posIParam = urlParamsPage.indexOf("i=");
          posInt = urlParamsPage.indexOf("?");

          if (posIParam < 0) {
                var posFirstEquals = urlParamsPage.indexOf("=");
                var firstParamBefore = urlParamsPage.substring(posInt+1, posFirstEquals);
                var firstParamAfter = "i=1&" + firstParamBefore;  
                currentUrlString = urlParamsPage.replace(firstParamBefore, firstParamAfter);            
          }
          else {
                var posA = urlParamsPage.indexOf("&", posIParam);
                if (posA < 0) {
                     act = urlParamsPage.substring(posIParam, urlParamsPage.length);
                }
                else {
                     act = urlParamsPage.substring(posIParam, posA);
                }
                currentUrlString = urlParamsPage.replace(act, "i=1");
          }
          
          document.Form1.action = currentUrlString; 
          document.Form1.submit();
     }
}

</script>
